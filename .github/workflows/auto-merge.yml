name: Auto-Merge Trusted Bot PRs

# Merges a PR automatically ONLY when BOTH are true:
#   - The PR author is on the TRUSTED_AUTHORS allowlist below (bots, never humans)
#   - All check-runs on HEAD SHA completed with no failures
#
# The author allowlist below is the ONLY safety gate — this workflow does not
# rely on any required-reviewer ruleset or on PR Autopilot's own review job as
# an implicit gate. Two prior versions of "auto-merge on green" broke exactly
# this way and were disabled org-wide 2026-07-17:
#   1. check_suite-triggered, gated on a required CodeRabbit reviewer check.
#      CodeRabbit was removed 2026-06-11 — the gate silently vanished, and the
#      workflow started merging ANY green-CI PR with zero review. Found live
#      (armed) in 9 repos a month later.
#   2. workflow_run-triggered off "PR Autopilot" completing, with no author
#      check — merges any PR (human included) the instant autopilot's own
#      checks pass, which conflicts with the org's stated post-2026-06-11
#      policy of deliberate human-triggered merges via `aaa-merge`.
#
# Do not weaken or remove the author check below, and do not widen
# TRUSTED_AUTHORS without deliberately deciding to — every login added here
# merges without human review once CI is green.
#
# Rollout: opt-in per repo. Only add this to repos with real trusted-bot PR
# volume worth auto-merging (e.g. dependabot dependency bumps). Do not copy
# this blindly org-wide — that's what caused both incidents above.

on:
  check_suite:
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  checks: read

concurrency:
  group: auto-merge-bots-${{ github.repository }}-${{ github.event.check_suite.head_sha }}
  cancel-in-progress: false

env:
  # Trusted bot logins allowed to auto-merge, space-separated. Add carefully.
  TRUSTED_AUTHORS: "dependabot[bot]"

jobs:
  auto-merge:
    # Skip check_suite events with no associated PR (e.g. direct pushes to default branch).
    if: github.event.check_suite.pull_requests[0] != null
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate and merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          SHA="${{ github.event.check_suite.head_sha }}"
          # check_suite.pull_requests excludes fork PRs already — no fork guard needed.
          PR_NUMBER="${{ github.event.check_suite.pull_requests[0].number }}"

          if [ -z "$PR_NUMBER" ]; then
            echo "No open PR found for SHA $SHA — nothing to merge."
            exit 0
          fi
          echo "PR #$PR_NUMBER  HEAD $SHA"

          # ── Gate 1: author must be a trusted bot ───────────────────────────
          AUTHOR=$(gh api "/repos/$REPO/pulls/$PR_NUMBER" --jq '.user.login')
          IS_TRUSTED=false
          for trusted in $TRUSTED_AUTHORS; do
            if [ "$AUTHOR" = "$trusted" ]; then
              IS_TRUSTED=true
              break
            fi
          done
          if [ "$IS_TRUSTED" != "true" ]; then
            echo "Author '$AUTHOR' is not on the trusted-bot allowlist — not auto-merging. Human review required."
            exit 0
          fi
          echo "Author '$AUTHOR' is trusted."

          # ── Gate 2: at least one check-run, all completed, none failed ────
          CHECK_RUNS=$(gh api "/repos/$REPO/commits/$SHA/check-runs" --paginate \
            --jq '.check_runs[]' | jq -s '.')

          TOTAL=$(echo "$CHECK_RUNS"   | jq 'length')
          PENDING=$(echo "$CHECK_RUNS" | jq '[.[] | select(.status != "completed")] | length')
          FAILED=$(echo "$CHECK_RUNS"  | jq '[.[] | select(
            .conclusion == "failure" or
            .conclusion == "timed_out" or
            .conclusion == "cancelled" or
            .conclusion == "action_required"
          )] | length')

          if [ "$TOTAL" -eq 0 ]; then
            echo "No check-runs found for $SHA — not merging (no CI evidence)."
            exit 0
          fi
          if [ "$PENDING" -gt 0 ]; then
            echo "$PENDING check(s) still pending — not merging yet."
            exit 0
          fi
          if [ "$FAILED" -gt 0 ]; then
            echo "$FAILED check(s) failed — not merging."
            exit 0
          fi

          echo "All checks green and author trusted. Merging PR #$PR_NUMBER..."
          if gh pr merge "$PR_NUMBER" --squash --delete-branch --repo "$REPO" 2>&1; then
            echo "Merged via squash."
            exit 0
          fi
          if gh pr merge "$PR_NUMBER" --auto --squash --delete-branch --repo "$REPO" 2>&1; then
            echo "Queued for auto-merge."
            exit 0
          fi

          echo "::warning::Both merge attempts failed for PR #$PR_NUMBER. Manual merge may be needed."
          exit 0
