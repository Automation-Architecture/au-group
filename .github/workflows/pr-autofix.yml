# Auto-fix on CodeRabbit/Copilot review comments. Hardened: same-repo push only, path allowlist, no merge.
name: PR auto-fix (no merge)

on:
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]
  pull_request:
    types: [labeled]

# Write only used after same-repo guard; fork PRs get comments-only (read)
permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: pr-autofix-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

env:
  REVIEW_BOTS: '["coderabbitai[bot]","coderabbit[bot]","copilot-pull-request-reviewer[bot]","github-copilot[bot]"]'
  # Cursor agent opt-in (default off — set repo variable AUTOFIX_CURSOR_ENABLED=true to enable)
  AUTOFIX_CURSOR_ENABLED: ${{ vars.AUTOFIX_CURSOR_ENABLED || 'false' }}

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether to run
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          COMMENT_USER: ${{ github.event.comment.user.login || github.event.review.user.login || '' }}
          COMMENT_BODY: ${{ github.event.comment.body || '' }}
          REVIEW_STATE: ${{ github.event.review.state || '' }}
          LABEL_NAME: ${{ github.event.label.name || '' }}
          AUTHOR_ASSOC: ${{ github.event.comment.author_association || '' }}
          REVIEW_BOTS: ${{ env.REVIEW_BOTS }}
        run: |
          is_bot() {
            echo "${REVIEW_BOTS}" | jq -e --arg u "$1" 'index($u) != null' >/dev/null 2>&1
          }

          RUN=false
          REASON=""
          TRIGGER=""

          case "${EVENT}" in
            pull_request_review_comment)
              if is_bot "${COMMENT_USER}"; then
                RUN=true
                TRIGGER=bot
                REASON="review comment from bot"
              else
                REASON="not a review bot"
              fi
              ;;
            pull_request_review)
              if [ "${REVIEW_STATE}" = "commented" ] || [ "${REVIEW_STATE}" = "changes_requested" ]; then
                if is_bot "${COMMENT_USER}"; then
                  RUN=true
                  TRIGGER=bot
                  REASON="review submitted by bot"
                else
                  REASON="human review — skipped"
                fi
              else
                REASON="review state skipped"
              fi
              ;;
            issue_comment)
              if [ -n "${{ github.event.issue.pull_request }}" ]; then
                if echo "${COMMENT_BODY}" | grep -q '/autofix'; then
                  case "${AUTHOR_ASSOC}" in
                    OWNER|MEMBER)
                      RUN=true
                      TRIGGER=manual
                      REASON="manual /autofix"
                      ;;
                    *)
                      REASON="insufficient permission for /autofix"
                      ;;
                  esac
                else
                  REASON="issue comment without /autofix"
                fi
              else
                REASON="not a PR issue comment"
              fi
              ;;
            pull_request)
              if [ "${LABEL_NAME}" = "autofix" ]; then
                RUN=true
                TRIGGER=label
                REASON="label autofix"
              fi
              ;;
          esac

          echo "run=${RUN}" >> "$GITHUB_OUTPUT"
          echo "reason=${REASON}" >> "$GITHUB_OUTPUT"
          echo "trigger=${TRIGGER}" >> "$GITHUB_OUTPUT"
          echo "Gate: run=${RUN} trigger=${TRIGGER}"

      - name: Resolve PR number
        if: steps.gate.outputs.run == 'true'
        id: pr
        run: |
          case "${{ github.event_name }}" in
            issue_comment)
              echo "number=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Security guard (fork + trusted actor)
        if: steps.gate.outputs.run == 'true'
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          TRIGGER_KIND: ${{ steps.gate.outputs.trigger }}
          AUTOFIX_ALLOWED_ACTORS: ${{ vars.AUTOFIX_ALLOWED_ACTORS || '' }}
        run: |
          chmod +x scripts/ci/autofix-pr-guard.sh
          ./scripts/ci/autofix-pr-guard.sh

      - name: Throttle (max 1 run / 10 min per PR)
        if: steps.gate.outputs.run == 'true'
        id: throttle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NUM="${{ steps.pr.outputs.number }}"
          REPO="${{ github.repository }}"
          CUTOFF=$(date -u -d '10 minutes ago' +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -v-10M +%Y-%m-%dT%H:%M:%SZ)
          RECENT=$(gh api "repos/${REPO}/issues/${NUM}/comments" --paginate \
            --jq "[.[] | select(.user.login==\"github-actions[bot]\") | select(.body | test(\"\\\\[autofix-bot\\\\]\")) | select(.created_at > \"${CUTOFF}\")] | length")
          if [ "${RECENT}" != "0" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Acknowledge (no auto-merge)
        if: steps.gate.outputs.run == 'true' && steps.throttle.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MODE="push"
          if [ "${{ steps.guard.outputs.comments_only }}" = "true" ]; then
            MODE="comments-only (fork PR)"
          fi
          gh pr comment "${{ steps.pr.outputs.number }}" --repo "${{ github.repository }}" --body "$(cat <<EOF
          [autofix-bot] **PR auto-fix** started (${MODE}) — **does not merge**.

          - CodeRabbit: \`@coderabbitai fix\` (only under \`services/document-parser/\` when possible)
          - Mechanical: Ruff on \`services/document-parser/\` (same-repo PRs only)
          - Merge only after **CI all-green** + **human approval**
          EOF
          )"

      - name: Request CodeRabbit fixes
        if: steps.gate.outputs.run == 'true' && steps.throttle.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ steps.pr.outputs.number }}" --repo "${{ github.repository }}" \
            --body "[autofix-bot] @coderabbitai fix

          Apply safe fixes from review comments. **Only modify \`services/document-parser/**\`.**
          Do not change \`.github/\`, \`workflows/\`, \`supabase/\`, or CI scripts. Do not merge."

      - name: Resolve PR head branch
        if: steps.gate.outputs.run == 'true' && steps.throttle.outputs.skip != 'true' && steps.guard.outputs.can_push == 'true'
        id: branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH=$(gh pr view "${{ steps.pr.outputs.number }}" --repo "${{ github.repository }}" --json headRefName -q .headRefName)
          echo "ref=${BRANCH}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        if: steps.gate.outputs.run == 'true' && steps.throttle.outputs.skip != 'true' && steps.guard.outputs.can_push == 'true'
        with:
          ref: ${{ steps.branch.outputs.ref }}
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        if: steps.gate.outputs.run == 'true' && steps.throttle.outputs.skip != 'true' && steps.guard.outputs.can_push == 'true'
        id: paths
        with:
          filters: |
            parser:
              - 'services/document-parser/**'

      - name: Mechanical Ruff fix (document-parser)
        if: steps.gate.outputs.run == 'true' && steps.throttle.outputs.skip != 'true' && steps.guard.outputs.can_push == 'true' && steps.paths.outputs.parser == 'true'
        working-directory: services/document-parser
        run: |
          pip install ruff==0.9.6
          ruff check app tests --fix || true
          ruff format app tests

      - name: Commit mechanical fixes (allowlist only)
        if: steps.gate.outputs.run == 'true' && steps.throttle.outputs.skip != 'true' && steps.guard.outputs.can_push == 'true' && steps.paths.outputs.parser == 'true'
        env:
          BRANCH: ${{ steps.branch.outputs.ref }}
        run: |
          chmod +x scripts/ci/autofix-safe-commit.sh
          ./scripts/ci/autofix-safe-commit.sh "chore(ci): mechanical autofix (ruff)" "${BRANCH}"

      - name: Apply review fixes via Cursor Agent (opt-in)
        if: steps.gate.outputs.run == 'true' && steps.throttle.outputs.skip != 'true' && steps.guard.outputs.can_push == 'true' && env.AUTOFIX_CURSOR_ENABLED == 'true'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          REVIEW_BOTS: ${{ env.REVIEW_BOTS }}
          AUTOFIX_CURSOR_ENABLED: ${{ env.AUTOFIX_CURSOR_ENABLED }}
          AUTOFIX_COMMENTS_ONLY: ${{ steps.guard.outputs.comments_only }}
          CURSOR_SDK_VERSION: "1.0.0"
        run: |
          chmod +x scripts/ci/cursor-pr-autofix.sh
          ./scripts/ci/cursor-pr-autofix.sh \
            "${{ steps.pr.outputs.number }}" \
            "${{ github.repository }}" \
            "${{ steps.branch.outputs.ref }}"

      - name: Remind — merge is manual
        if: always() && steps.gate.outputs.run == 'true' && steps.throttle.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ steps.pr.outputs.number }}" --repo "${{ github.repository }}" --body \
            "[autofix-bot] Auto-fix finished. **Merge is not automatic** — review bot commits, confirm CI green, merge manually."
