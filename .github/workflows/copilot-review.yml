name: Request Copilot Code Review

# Formally requests `Copilot` as a reviewer on every PR.
#
# The enforced merge gate is this workflow's own `request-copilot-review`
# CheckRun, which IS visible in the PR-level `statusCheckRollup` that the AAA
# branch-protection ruleset evaluates. The dynamic `copilot-pull-request-reviewer`
# check that requesting Copilot also produces is INVISIBLE to the rollup, so it
# is NOT the gate — requiring it as a context made every PR need `--admin` even
# when it succeeded (fixed org-wide 2026-05-22).
#
# Distributing this workflow to every active AAA repo is the mechanism that
# makes "wait for Copilot before merging" enforceable platform-wide.

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  pull-requests: write

jobs:
  request-copilot-review:
    runs-on: ubuntu-latest
    steps:
      - name: Request Copilot review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh pr edit "$PR_NUMBER" \
            --repo "$REPO" \
            --add-reviewer "Copilot" \
          || echo "::warning::Could not add Copilot reviewer — ensure Copilot Code Review is enabled at the org level: https://github.com/organizations/Automation-Architecture/settings/copilot/policies"
