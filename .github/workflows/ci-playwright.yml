name: CI — Playwright E2E

on:
  workflow_call:

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Install parser system dependencies
        uses: ./.github/actions/setup-parser-ci
        with:
          install-python-deps: "false"

      - name: Generate parser E2E credentials
        run: |
          chmod +x scripts/ci/generate-parser-test-env.sh
          source scripts/ci/generate-parser-test-env.sh

      - name: Start document-parser for E2E
        run: |
          chmod +x scripts/ci/start-parser-for-e2e.sh
          ./scripts/ci/start-parser-for-e2e.sh

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: e2e
        env:
          PARSER_BASE_URL: http://127.0.0.1:8001
          PLAYWRIGHT_HTML_OPEN: never
          CI: true
        run: npm test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
