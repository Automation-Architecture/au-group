name: CI — document-parser

on:
  workflow_call:

jobs:
  lint-test-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/document-parser
    steps:
      - uses: actions/checkout@v7

      - name: Setup parser CI environment
        uses: ./.github/actions/setup-parser-ci

      - name: Ruff lint
        run: ruff check app pipeline tests

      - name: Run tests with coverage
        run: |
          # shellcheck source=scripts/ci/generate-parser-test-env.sh
          source "${GITHUB_WORKSPACE}/scripts/ci/generate-parser-test-env.sh"
          export APP_ENV=development
          export RATE_LIMIT_ENABLED=false
          pytest tests/ -q --ignore=tests/integration -m "not smoke" \
            --cov=app --cov=pipeline --cov-report=term-missing --cov-fail-under=60

      - name: Dummy PDF API smoke tests
        run: |
          # shellcheck source=scripts/ci/generate-parser-test-env.sh
          source "${GITHUB_WORKSPACE}/scripts/ci/generate-parser-test-env.sh"
          export APP_ENV=development
          export RATE_LIMIT_ENABLED=false
          pytest tests/test_api_dummy_pdf_smoke.py -m smoke -v

      - name: Dependency audit
        run: |
          pip-audit -r requirements.txt \
            --ignore-vuln PYSEC-2025-183 \
            --ignore-vuln CVE-2025-45768
