name: CI — Trivy (parser deps)

on:
  workflow_call:

permissions:
  contents: read
  security-events: write

jobs:
  trivy-fs:
    name: Trivy fs (document-parser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Trivy
        run: |
          chmod +x scripts/ci/install-trivy.sh
          ./scripts/ci/install-trivy.sh

      - name: Write SARIF (non-blocking)
        run: |
          trivy fs \
            --scanners vuln \
            --ignore-unfixed \
            --ignorefile services/document-parser/.trivyignore \
            --format sarif \
            --output trivy-fs.sarif \
            --exit-code 0 \
            services/document-parser

      - name: Scan parser tree (CRITICAL, HIGH)
        run: |
          trivy fs \
            --scanners vuln \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --ignorefile services/document-parser/.trivyignore \
            --format table \
            --exit-code 1 \
            services/document-parser

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
          wait-for-processing: false
