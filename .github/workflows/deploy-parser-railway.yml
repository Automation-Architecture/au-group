# NOTE (2026-06-01, KD-74): document-parser deploys via Railway's NATIVE GitHub source
# connection (project au-group-be, service "au-group", root services/document-parser) — it
# auto-deploys on every push to main, independent of this workflow. The previous `railway up`
# deploy-staging / deploy-production jobs were redundant and failed on an empty RAILWAY_TOKEN
# that was never configured. They (and the dependent smoke-staging / smoke-production gates)
# have been removed; this workflow is now CI-only — the pre-merge validation gates for the
# parser. Post-deploy smoke is covered by the scheduled smoke-e2e.yml.
# See docs/ci/deploy-workflow-investigation-2026-06-01.md.
name: document-parser CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "services/document-parser/**"
      - ".github/workflows/deploy-parser-railway.yml"

permissions:
  contents: read
  actions: write
  security-events: write

jobs:
  ci:
    uses: ./.github/workflows/ci-parser.yml

  security:
    uses: ./.github/workflows/ci-security.yml
    with:
      scope: diff

  codeql:
    uses: ./.github/workflows/ci-codeql.yml

  trivy:
    uses: ./.github/workflows/ci-trivy.yml
