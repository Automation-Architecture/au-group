name: Deploy Supabase migrations

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-supabase.yml"

permissions:
  contents: read
  actions: write # upload-artifact in ci-security + deploy
  security-events: write

concurrency:
  group: deploy-supabase-production-${{ github.repository }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci-supabase.yml

  security:
    uses: ./.github/workflows/ci-security.yml
    with:
      scope: diff

  deploy:
    # DISABLED 2026-06-01 (KD-74) — see docs/ci/deploy-workflow-investigation-2026-06-01.md.
    # The live DB is maintained via Supabase MCP apply_migration; the repo migrations dir has
    # diverged from prod (45 live-only, 10 stale repo-only — incl. a KD-71 migration that would
    # REGRESS au_group_list_company_creditors). Running `db push` here would regress live, so the
    # deploy job is fail-closed off until repo<->live is reconciled in KD-74. The ci + security
    # jobs above still run (on pushes to main and manual dispatch). Do NOT add SUPABASE_* secrets
    # to re-arm this until KD-74 lands.
    if: false
    needs: [ci, security]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6

      - uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Link and push migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          supabase link --project-ref "${SUPABASE_PROJECT_REF}" --password "${SUPABASE_DB_PASSWORD}"
          supabase db push --linked

      - name: Check TypeScript types drift
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          supabase gen types typescript --linked > types/database.types.ts.new
          if ! diff -q types/database.types.ts types/database.types.ts.new >/dev/null 2>&1; then
            echo "::warning::types/database.types.ts differs from generated types. Run locally:"
            echo "  supabase gen types typescript --linked > types/database.types.ts"
          fi
          rm -f types/database.types.ts.new

      - name: Upload types artifact
        uses: actions/upload-artifact@v7
        with:
          name: database-types
          path: types/database.types.ts
          if-no-files-found: warn
