# Legacy parser-only workflow for main/develop push. All PRs: ci.yml (full suite).
name: document-parser

on:
  push:
    branches: [main, develop]
    paths:
      - "services/document-parser/**"
      - ".github/workflows/document-parser.yml"
      - ".github/workflows/ci-parser.yml"

jobs:
  test-and-audit:
    uses: ./.github/workflows/ci-parser.yml
