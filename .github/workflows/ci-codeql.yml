name: CI — CodeQL

on:
  workflow_call:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: CodeQL (document-parser)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/document-parser/requirements.txt

      - name: Install parser dependencies (CodeQL trace)
        working-directory: services/document-parser
        run: pip install -r requirements.txt

      - uses: github/codeql-action/init@7188fc363630916deb702c7fdcf4e481b751f97a # v3
        with:
          languages: python
          config-file: ./.github/codeql/codeql-config.yml

      - uses: github/codeql-action/analyze@7188fc363630916deb702c7fdcf4e481b751f97a # v3
        with:
          category: /language:python-document-parser
