name: CI — container scan (Trivy)

on:
  workflow_call:

permissions:
  contents: read
  security-events: write

jobs:
  trivy:
    name: Trivy (document-parser image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build document-parser image
        run: |
          docker build \
            -t au-group-document-parser:ci \
            -f services/document-parser/Dockerfile \
            services/document-parser

      # Pin full SHA (not @0.28.0): old tags were removed/renamed to v-prefix after GHSA-69fq-xp46-6x23
      - name: Scan image (CRITICAL, HIGH)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: au-group-document-parser:ci
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          # Gate Python deps (same layer as pip-audit). OS packages are upgraded in Dockerfile;
          # unfixed Debian base CVEs are reported in SARIF but do not block merge.
          vuln-type: library
          scanners: vuln
          trivyignores: services/document-parser/.trivyignore

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: trivy-image.sarif
          category: trivy-container
          wait-for-processing: false
