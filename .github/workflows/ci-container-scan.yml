name: CI — container scan (Trivy)

on:
  workflow_call:

permissions:
  contents: read
  security-events: write

jobs:
  trivy:
    name: Trivy (document-parser image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build document-parser image
        run: |
          docker build \
            -t au-group-document-parser:ci \
            -f services/document-parser/Dockerfile \
            services/document-parser

      - name: Scan image (CRITICAL, HIGH)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: au-group-document-parser:ci
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: trivy-image.sarif
          category: trivy-container
          wait-for-processing: false
