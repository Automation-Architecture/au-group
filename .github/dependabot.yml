version: 2
updates:
  - package-ecosystem: pip
    directory: /services/document-parser
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      production-deps:
        patterns:
          - "*"
        exclude-patterns:
          - "pytest*"
          - "ruff*"
          - "pytest-cov*"

  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
