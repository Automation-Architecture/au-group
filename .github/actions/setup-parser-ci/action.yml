name: Setup document-parser CI
description: Python cache, OCR system packages, and optional dev dependencies for parser CI jobs
inputs:
  python-version:
    description: Python version
    required: false
    default: "3.11"
  working-directory:
    description: Parser package directory (repo root relative)
    required: false
    default: services/document-parser
  install-python-deps:
    description: Install requirements-dev.txt after setup-python
    required: false
    default: "true"
  install-system-deps:
    description: Install tesseract/poppler/apt packages
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      if: inputs.install-python-deps == 'true'
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: |
          ${{ inputs.working-directory }}/requirements.txt
          ${{ inputs.working-directory }}/requirements-dev.txt

    - name: Install OCR system dependencies
      if: inputs.install-system-deps == 'true'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y tesseract-ocr poppler-utils libgl1

    - name: Install Python dev dependencies
      if: inputs.install-python-deps == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
