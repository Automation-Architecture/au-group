# CodeRabbit — AI PR review + auto-fix on request. Does NOT merge PRs.
# Docs: https://docs.coderabbit.ai/getting-started/yaml-configuration
language: en-US

reviews:
  profile: assertive
  # Never auto-approve / auto-merge via CodeRabbit (human + branch protection required)
  auto_approve: false
  high_level_summary: true
  commit_status: true
  auto_review:
    enabled: true
    drafts: false
  finishing_touches:
    docstrings:
      enabled: false
    simplify:
      enabled: false
    unit_tests:
      enabled: false

chat:
  auto_reply: true

# Pre-merge checks from CodeRabbit are advisory unless you enable request-changes workflow.
# Repo merge gate remains: CI `all-green` + 1 human approval (see .github/BRANCH_PROTECTION.md).
